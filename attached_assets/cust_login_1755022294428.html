<!DOCTYPE html>
<html>
    <head>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        >
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </head>
    <body>
        <form
            method="post"
            action="/app/login/nllogin.nl"
            target="_parent"
            onsubmit="if (typeof(this.submitted)!='undefined') return false; if (checkemail(email,false,true) && checknotempty(document.forms[0].password,'Password')) {this.submitted=1;return true;} else return false; "
        >
            <div class="form-control" style="border: 0">
                <div class="row">
                    <div class="col">
                        <h2 style="font-weight: 800; font-size: 24px; margin-bottom: 0.5rem;">Log In</h2>
                    </div>
                    <div class="col">
                        <img
                            style="max-width: 250px; max-height: 100; vertical-align: middle; margin-bottom: 15px; padding-right: 10px;"
                            src="https://1212804.app.netsuite.com/images/logos/netsuite-oracle.svg"
                            alt="Company logo"
                            align="right"
                            id="login-logo"
                            class="logo-img"
                        >
                    </div>
                </div>
                <div class="mb-3">
                    <input
                        type="email"
                        class="form-control input"
                        name="email"
                        id="exampleInputEmail1"
                        placeholder="Email address"
                        onchange="rememberme.checked=false;"
                    >
                </div>
                <div class="mb-3">
                    <input
                        type="password"
                        class="form-control input"
                        id="exampleInputPassword1"
                        name="password"
                        size="30"
                        maxlength="16"
                        placeholder="Password"
                    >
                </div>
                <div class="mb-3 form-check">
                    <input
                        type="checkbox"
                        class="form-check-input checkbox"
                        id="exampleCheck1"
                        name="rememberme"
                        value="T"
                        tabindex="-1"
                    >
                    <label class="form-check-label" for="exampleCheck1">Remember Me</label>
                </div>
                <button
                    type="submit"
                    class="btn btn-primary"
                    style="width:100%; background-color: #e28212; color: white; font-weight: bold; margin-bottom: 15px;"
                    onClick="document.forms[0].jsenabled.value = 'T'; setLoginCookie(rememberme.checked);"
                >Log In</button>
                <div class="mb-3">
                    <a href="https://system.netsuite.com/pages/pwdreset.jsp" style="color: #4b7c8b;">Forgot your password?</a>
                </div>
            </div>
        </form>
    </body>
</html>
